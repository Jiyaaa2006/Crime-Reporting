<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SafeReport</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none;">Safe<span>Report</span></a></div>
  <div><a href="signup.html">Sign Up</a></div>
</nav>

<div class="container" style="max-width:420px;">
  <div class="card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your account.</p>
    <div id="msg"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <button type="submit" class="primary">Login</button>
    </form>
    <div class="link-row">Don't have an account? <a href="signup.html">Sign Up</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
