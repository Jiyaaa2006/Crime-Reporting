<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Crime - SafeReport</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none;">Safe<span>Report</span></a></div>
  <div>
    <a href="dashboard.html">My Cases</a>
    <a href="report.html">Report Crime</a>
    <button id="logoutBtn">Logout</button>
  </div>
</nav>

<div class="container" style="max-width:600px;">
  <div class="card">
    <h1>Report a Crime</h1>
    <p class="subtitle">Fill in the details below. Your report will be reviewed by an officer.</p>
    <div id="msg"></div>
    <form id="reportForm">
      <label>Crime Title</label>
      <input type="text" id="title" placeholder="e.g. Theft at Main Street Market" required>

      <label>Crime Type</label>
      <select id="crimeType" required>
        <option value="">Select type</option>
        <option>Theft</option>
        <option>Assault</option>
        <option>Burglary</option>
        <option>Vandalism</option>
        <option>Fraud</option>
        <option>Cybercrime</option>
        <option>Missing Person</option>
        <option>Other</option>
      </select>

      <label>Location</label>
      <input type="text" id="location" placeholder="e.g. Near City Park, Vadodara" required>

      <label>Date of Incident</label>
      <input type="date" id="incidentDate" required>

      <label>Description</label>
      <textarea id="description" placeholder="Describe what happened in detail..." required></textarea>

      <button type="submit" class="primary">Submit Report</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/report.js"></script>
</body>
</html>
