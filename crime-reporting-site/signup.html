<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - SafeReport</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none;">Safe<span>Report</span></a></div>
  <div><a href="login.html">Login</a></div>
</nav>

<div class="container" style="max-width:420px;">
  <div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">Sign up to report and track cases.</p>
    <div id="msg"></div>
    <form id="signupForm">
      <label>Full Name</label>
      <input type="text" id="fullName" required>
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required minlength="6">
      <button type="submit" class="primary">Sign Up</button>
    </form>
    <div class="link-row">Already have an account? <a href="login.html">Login</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
